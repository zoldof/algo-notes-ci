name: Move Files

on:
  workflow_dispatch:
    inputs:
      source_dir:
        description: "Source directory"
        required: true
        default: "source-dir"
      dist_dir:
        description: "Destination directory"
        required: true
        default: "dist-dir"

permissions:
  contents: write

env:
  SOURCE_DIR: ${{ inputs.source_dir }}
  DIST_DIR: ${{ inputs.dist_dir }}

jobs:
  move_files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Move files
        run: |
          mkdir -p "$SOURCE_DIR" "$DIST_DIR"

          if [ -d "$SOURCE_DIR" ] && [ "$(ls -A "$SOURCE_DIR")" ]; then
            mv "$SOURCE_DIR"/* "$DIST_DIR"/
          fi

          git add .
          git diff-index --quiet HEAD || git commit -m "Move files from $SOURCE_DIR to $DIST_DIR"
          git push
