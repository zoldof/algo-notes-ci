<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google-site-verification" content="{{ site.google_site_verification }}">
  <meta name="robots" content="{{ page.robots }}">
  <meta name="description" content="{{ page.description }}">
  <!-- Include -->
  {% include assign-og.html %}
  <link rel="canonical" href="{{ full_url }}">
  <title>{{ page.title }}</title>
  <!-- General -->
  <link rel="manifest" href="{{ site.cdn_base }}main/docs/manifest.json">
  <link rel="icon" href="{{ site.cdn_base }}main/docs/favicon.png">
  <link rel="apple-touch-icon" href="{{ site.cdn_base }}main/docs/favicon.png">
  <!-- Test and Purge *コメントの中身でもビルドバージョン変更が反映されるのでクォートで囲っている -->  
  <!-- href="{{ site.cdn_base }}{{ 'site.github.build_revision' }}/docs/style.css"> -->
  <!-- append: 'site.github.build_revision' | -->
  <!-- https://purge.jsdelivr.net/gh/zoldof/algo-notes-ci@main/docs -->
<body class="page-{{ slug }}">
  <header class="site-hero">
    <img
      src="{{ site.cdn_base }}main/docs/dist/{{ slug }}/header.png"
      alt="特設ページのヘッダー画像"
      class="site-hero__img"
    />
    <a id="site-hero__home" class="site-hero__iconBtn" href="{{ origin_url }}">🌏</a>
    <div class="site-hero__music">
      <button id="site-hero__music" class="site-hero__iconBtn" type="button" aria-label="music">🎵</button>
      <audio id="audio" preload="metadata" src="{{ site.cdn_base }}main/docs/dist/{{ slug }}/music.mp3"></audio>
    </div>
  </header>
  <div id="content">
    <!-- Liquid -->
    {{ content }}
  </div>
</body>
</html>
